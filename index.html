<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云计算与分布式系统 · 实验2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f3f5f9;
    color: #1f2733;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    max-width: 760px;
    width: 100%;
    border-radius: 16px;
    border: 1px solid #e3e8f0;
    padding: 48px 44px;
  }
  .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 1px;
    color: #185fa5;
    background: #e6f1fb;
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 20px;
  }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .sub { color: #5f6b7a; font-size: 15px; margin-top: 8px; }
  hr { border: none; border-top: 1px solid #eaeef5; margin: 28px 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .item {
    background: #f7f9fc;
    border: 1px solid #e8edf5;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .item .k { font-size: 12px; color: #7b8798; margin-bottom: 4px; }
  .item .v { font-size: 14px; font-weight: 500; color: #1f2733; word-break: break-all; }
  .note {
    margin-top: 28px;
    background: #e1f5ee;
    border-left: 3px solid #1d9e75;
    border-radius: 6px;
    padding: 14px 18px;
    font-size: 14px;
    color: #0f6e56;
  }
  footer {
    margin-top: 32px;
    font-size: 13px;
    color: #9aa5b4;
    text-align: center;
  }
  @media (max-width: 560px) {
    .card { padding: 32px 22px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="tag">云计算与分布式系统</span>
    <h1>实验2 · 云环境下的服务器环境搭建</h1>
    <p class="sub">本页面已通过 GitHub Pages 发布到公网，可正常访问。</p>

    <hr>

    <div class="grid">
      <div class="item">
        <div class="k">实验平台</div>
        <div class="v">GitHub Pages</div>
      </div>
      <div class="item">
        <div class="k">部署方式</div>
        <div class="v">静态托管 · 分支发布</div>
      </div>
      <div class="item">
        <div class="k">访问协议</div>
        <div class="v">HTTPS</div>
      </div>
      <div class="item">
        <div class="k">页面文件</div>
        <div class="v">index.html</div>
      </div>
    </div>

    <div class="note">
      实验完成标志：在任意网络环境下打开本页面的公网地址，均可正常显示即视为发布成功。
    </div>

    <footer id="ts">页面加载时间：2026/9/30 23:59:47</footer>
  </main>

  <script>
    document.getElementById('ts').textContent =
      '页面加载时间：' + new Date().toLocaleString('zh-CN');
  </script>
